[book]
title = "API Versioning Documentation"
authors = ["Chris Martinez"]
language = "en"

[rust]
edition = "2024"

[output.html]
site-url = "/api-versioning/"
git-repository-url = "https://github.com/commonsensesoftware/asp-rs-versioning/tree/main/guide"
edit-url-template = "https://github.com/commonsensesoftware/asp-rs-versioning/edit/main/guide/{path}"
default-theme = "Ayu"
additional-css = ["theme/custom.css"]

[output.html.playground]
editable = true
line-numbers = true
runnable = false

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2
